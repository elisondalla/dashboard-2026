<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jardinagem - Setembro/26</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#fff;font-family:'Segoe UI',Arial,sans-serif;padding:30px 40px}
.page-header{text-align:center;margin-bottom:35px}
.page-header h1{font-size:30px;text-transform:uppercase;letter-spacing:4px;color:#22c55e;font-weight:700;margin-bottom:6px;text-shadow:0 0 25px rgba(34,197,94,.5)}
.page-header .sub{font-size:12px;color:#888;letter-spacing:4px;text-transform:uppercase}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1300px;margin:0 auto 40px auto}
.kpi-card{background:linear-gradient(135deg,#252525 0%,#1f1f1f 100%);border-radius:12px;padding:22px;border-left:4px solid #22c55e;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05),0 0 25px rgba(34,197,94,.15)}
.kpi-card.verde{border-left-color:#22c55e;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05),0 0 25px rgba(34,197,94,.15)}
.kpi-card.amarelo{border-left-color:#eab308;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05),0 0 25px rgba(234,179,8,.15)}
.kpi-card.vermelho{border-left-color:#ef4444;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05),0 0 25px rgba(239,68,68,.15)}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#888;margin-bottom:8px}
.kpi-valor{font-size:32px;font-weight:700;color:#fff;line-height:1}
.kpi-detalhe{font-size:12px;color:#666;margin-top:6px}
.section-divider{max-width:1300px;margin:50px auto 28px auto;padding-bottom:12px;border-bottom:2px solid #2a2a2a;display:flex;align-items:center;gap:12px}
.section-divider.preventivas h2{font-size:18px;text-transform:uppercase;letter-spacing:3px;font-weight:700;color:#ef4444;text-shadow:0 0 20px rgba(239,68,68,.5)}
.section-divider.ranking h2{color:#fbbf24;text-shadow:0 0 20px rgba(251,191,36,.5)}
.bloco{max-width:1300px;margin:0 auto 28px auto}
.bloco-header{padding:12px 20px;border-radius:8px;margin-bottom:14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;letter-spacing:1px}
.bloco-verde{background:rgba(34,197,94,.12);color:#22c55e;border-left:3px solid #22c55e;box-shadow:0 0 20px rgba(34,197,94,.15)}
.bloco-amarelo{background:rgba(234,179,8,.12);color:#eab308;border-left:3px solid #eab308;box-shadow:0 0 20px rgba(234,179,8,.15)}
.bloco-vermelho{background:rgba(239,68,68,.12);color:#ef4444;border-left:3px solid #ef4444;box-shadow:0 0 20px rgba(239,68,68,.15)}
.bloco-contador{margin-left:auto;font-size:12px;background:rgba(255,255,255,.08);padding:3px 12px;border-radius:12px;color:#ccc}
.tabela{width:100%;background:#202020;border-radius:10px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.03);margin-bottom:8px}
.tabela table{width:100%;border-collapse:collapse}
.tabela th{background:#2a2a2a;padding:12px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#999;font-weight:600;border-bottom:1px solid #333}
.tabela th.center{text-align:center}
.tabela td{padding:11px 16px;font-size:13px;border-top:1px solid #2a2a2a}
.tabela tr:hover{background:#252525}
.tabela td.center{text-align:center}
.tabela td.nome{font-weight:600;color:#eee}
.progress-wrap{display:flex;align-items:center;gap:10px;min-width:110px}
.progress-bar{flex:1;height:8px;background:#2a2a2a;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px}
.progress-fill.verde{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}
.progress-fill.amarelo{background:#eab308;box-shadow:0 0 8px rgba(234,179,8,.6)}
.progress-fill.vermelho{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.6)}
.progress-num{font-size:12px;font-weight:700;min-width:38px;text-align:right}
.progress-num.verde{color:#22c55e}
.progress-num.amarelo{color:#eab308}
.progress-num.vermelho{color:#ef4444}
.ranking-container{max-width:900px;margin:0 auto}
.rank-row{background:linear-gradient(135deg,#252525 0%,#1f1f1f 100%);border-radius:12px;padding:20px 28px;margin-bottom:14px;display:flex;align-items:center;gap:22px;border-left:4px solid #ef4444;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04),0 0 22px rgba(239,68,68,.12)}
.rank-pos{font-size:34px;font-weight:700;min-width:60px;text-align:center;color:#555}
.rank-pos.ouro{color:#fbbf24;text-shadow:0 0 20px rgba(251,191,36,.7)}
.rank-pos.prata{color:#c0c0c0;text-shadow:0 0 20px rgba(192,192,192,.6)}
.rank-pos.bronze{color:#cd7f32;text-shadow:0 0 20px rgba(205,127,50,.6)}
.rank-nome{font-size:17px;font-weight:700;text-transform:uppercase;min-width:280px}
.rank-info{display:flex;gap:22px;font-size:13px;color:#ccc;flex-grow:1}
.rank-info span strong{color:#fff;font-size:15px;margin-right:3px}
.rank-badge{font-size:15px;font-weight:700;padding:8px 16px;border-radius:30px;min-width:75px;text-align:center}
.rank-badge.verde{background:rgba(34,197,94,.2);color:#22c55e;border:2px solid #22c55e;box-shadow:0 0 18px rgba(34,197,94,.4)}
.rank-badge.amarelo{background:rgba(234,179,8,.2);color:#eab308;border:2px solid #eab308;box-shadow:0 0 18px rgba(234,179,8,.4)}
.rank-badge.vermelho{background:rgba(239,68,68,.2);color:#ef4444;border:2px solid #ef4444;box-shadow:0 0 18px rgba(239,68,68,.4)}
.rodape{text-align:center;margin-top:60px;padding-top:25px;border-top:1px solid #2a2a2a;color:#555;font-size:11px;letter-spacing:3px;text-transform:uppercase}
</style>
</head>
<body>

<div class="page-header">
  <h1>🌿 Jardinagem</h1>
  <div class="sub">Setembro/26 • Detalhamento por Prestador</div>
</div>

<div id="conteudo"></div>

<div class="rodape">Dashboard de Chamados • Categoria • Setembro/26</div>

<script>
function corPct(p){ if(p>=90) return 'verde'; if(p>=50) return 'amarelo'; return 'vermelho'; }
function renderTabela(lista){
  var html='<div class="tabela"><table><thead><tr><th>Prestador</th><th class="center">Total</th><th class="center">Em Atend.</th><th class="center">Fechados</th><th>Conclusão</th></tr></thead><tbody>';
  for(var i=0;i<lista.length;i++){
    var d=lista[i]; var cor=corPct(d[4]);
    html+='<tr><td class="nome">'+d[0]+'</td><td class="center">'+d[1]+'</td><td class="center">'+d[2]+'</td><td class="center">'+d[3]+'</td>';
    html+='<td><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill '+cor+'" style="width:'+d[4]+'%"></div></div><span class="progress-num '+cor+'">'+d[4]+'%</span></div></td></tr>';
  }
  return html+'</tbody></table></div>';
}
function separar(lista){
  var v=[],a=[],r=[];
  for(var i=0;i<lista.length;i++){
    var d=lista[i];
    if(d[4]>=90) v.push(d);
    else if(d[4]>=50) a.push(d);
    else r.push(d);
  }
  return {v:v,a:a,r:r};
}
function bloco(titulo,cls,lista){
  if(lista.length===0) return '';
  var cont=lista.length===1?'1 prestador':lista.length+' prestadores';
  return '<div class="bloco"><div class="bloco-header '+cls+'">'+titulo+'<span class="bloco-contador">'+cont+'</span></div>'+renderTabela(lista)+'</div>';
}
function kpiCard(label,valor,detalhe,cor){
  return '<div class="kpi-card '+cor+'"><div class="kpi-label">'+label+'</div><div class="kpi-valor">'+valor+'</div><div class="kpi-detalhe">'+detalhe+'</div></div>';
}
function medalha(i){
  if(i===0) return '<div class="rank-pos ouro">🥇</div>';
  if(i===1) return '<div class="rank-pos prata">🥈</div>';
  if(i===2) return '<div class="rank-pos bronze">🥉</div>';
  return '<div class="rank-pos">'+(i+1)+'º</div>';
}
function renderRanking(lista){
  var ordenada = lista.slice().sort(function(a,b){
    if (b[4] !== a[4]) return b[4] - a[4];
    return b[1] - a[1];
  });
  var html='<div class="ranking-container">';
  for(var i=0;i<ordenada.length;i++){
    var d=ordenada[i]; var cor=corPct(d[4]);
    html+='<div class="rank-row">'+medalha(i);
    html+='<div class="rank-nome">'+d[0]+'</div>';
    html+='<div class="rank-info"><span><strong>'+d[1]+'</strong> Total</span><span><strong>'+d[3]+'</strong> Fech.</span><span><strong>'+d[2]+'</strong> Atend.</span></div>';
    html+='<div class="rank-badge '+cor+'">'+d[4]+'%</div></div>';
  }
  return html+'</div>';
}

var prev=[
  ['AMARAL',15,0,15,100],
  ['VALDIR',5,0,5,100],
  ['RODRIGO ADILSON',15,0,15,100],
  ['ISRAEL',21,3,18,86],
  ['DJA',14,2,12,86],
  ['JASMIM',30,9,21,70],
  ['LEONARDO',11,8,3,27],
  ['RENATO',5,4,1,20]
];

var html='';
html+='<div class="section-divider preventivas"><h2>🛡️ Preventivas</h2></div>';
html+='<div class="kpi-grid">';
html+=kpiCard('Total de Chamados',101,'Preventivas em Setembro','');
html+=kpiCard('Fechados',75,'Concluídos','verde');
html+=kpiCard('Em Atendimento',26,'Pendentes','amarelo');
html+=kpiCard('% Conclusão','74%','Meta: 90%','vermelho');
html+='</div>';
var p=separar(prev);
html+=bloco('🏆 Destaques (≥ 90%)','bloco-verde',p.v);
html+=bloco('⚠️ Atenção (50-89%)','bloco-amarelo',p.a);
html+=bloco('🚨 Críticos (abaixo de 50%)','bloco-vermelho',p.r);

html+='<div class="section-divider ranking" style="margin-top:70px"><h2>🏆 Ranking de Prestadores</h2></div>';
html+='<div style="max-width:1300px;margin:0 auto 20px auto;text-align:center;font-size:14px;color:#ef4444;font-weight:700;text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 15px rgba(239,68,68,.5)">🛡️ Preventivas</div>';
html+=renderRanking(prev);

document.getElementById('conteudo').innerHTML=html;
</script>

</body>
</html>
